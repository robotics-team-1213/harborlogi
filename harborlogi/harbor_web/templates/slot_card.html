<div class="slot-card{% if not slot.stack %} empty{% endif %}" data-yard-row="{{ slot.key }}">{% if slot.label %}<span class="slot-name">{{ slot.label }}</span>{% endif %}{% for entry in slot.stack %}<span class="slot-level role-{{ entry.role }}"{% if entry.cargo %} data-cargo="{{ entry.cargo }}"{% endif %}>{% if slot.levels > 1 %}<b>{{ entry.level }}층</b> {% endif %}{{ entry.cargo }}{% if entry.role == 'target' %}<small>반출 대상</small>{% elif entry.role == 'rehandle' %}<small>재취급</small>{% endif %}{% if entry.partial %}<small>일부 칸</small>{% endif %}</span>{% empty %}<span class="slot-empty">비어 있음</span>{% endfor %}</div>
