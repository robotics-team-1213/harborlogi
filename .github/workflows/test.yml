name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: harborlogi

jobs:
  unittest:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  product-web:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      HARBOR_WEB_MODE: test
      HARBOR_WEB_SECRET_KEY: ci-test-only-not-a-deployment-secret-000000000000000000000000
      HARBOR_WEB_DATABASE: ":memory:"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[web]'
      - run: python -m django test harbor_web.tests --settings=harbor_web.settings --verbosity 1
      - run: python -m django makemigrations --check --dry-run --settings=harbor_web.settings
      - run: for t in tests/*.test.mjs; do node "$t" || exit 1; done
      - run: python tools/design_tokens.py --check
